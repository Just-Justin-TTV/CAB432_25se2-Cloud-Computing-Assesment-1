version: '3.9'

services:
  # Ollama AI service
  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: cab432-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    command: sh -c "ollama serve"
    # Health check to ensure Ollama API is ready
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 5s
      retries: 12

# Persistent volume for Ollama data
volumes:
  ollama_data:
