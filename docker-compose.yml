version: '3.9'

services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cab432-ollama
    restart: always
    ports:
      - "11434:11434"  # Expose Ollama externally
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      retries: 30
    networks:
      - cab432-network

volumes:
  ollama_data:

networks:
  cab432-network:
    external: true
