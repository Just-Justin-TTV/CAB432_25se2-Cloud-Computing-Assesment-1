version: '3.9'

services:
  ollama-flask:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cab432-ollama
    restart: always
    ports:
      - "80:80"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - cab432-network

volumes:
  ollama_data:

networks:
  cab432-network:
    external: true

