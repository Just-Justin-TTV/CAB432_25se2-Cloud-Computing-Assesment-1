version: '3.9'

services:
  memcached:
    image: memcached:latest
    container_name: cab432-memcached
    restart: always
    ports:
      - "11211:11211"
    networks:
      - cab432-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cab432-web
    depends_on:
      memcached:
        condition: service_started
    ports:
      - "8000:8000"
    command: ["/code/entrypoint.sh"]
    environment:
      # Database configuration
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
      DB_SSLMODE: ${DB_SSLMODE}

      # S3 storage configuration
      USE_S3: "True"
      AWS_PROFILE: "CAB432-STUDENT"
      AWS_REGION: "ap-southeast-2"
      AWS_STORAGE_BUCKET_NAME: "justinsinghatwalbucket"

      # Ollama URL (point to external Ollama microservice)
      OLLAMA_URL: "http://172.31.98.122"

      # Memcached configuration
      MEMCACHED_HOST: "memcached"
      MEMCACHED_PORT: "11211"

    volumes:
      - .:/code
      - C:\Users\Justin\.aws:/root/.aws:ro

    # Optional healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      retries: 5

    networks:
      - cab432-network

networks:
  cab432-network:
    external: true
